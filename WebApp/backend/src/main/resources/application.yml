spring:
  jackson.deserialization.fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/luatgt?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:luatgt}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_jdbc_type: BINARY
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
  data.redis:
    url: ${REDIS_URL:redis://localhost:6379}
    repositories.enabled: false
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 21MB
server:
  port: 8080
  error.include-message: never
  tomcat.max-part-count: 5
app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  kag-url: ${KAG_BASE_URL:http://localhost:8000}
  minio-url: ${MINIO_URL:http://localhost:9000}
  minio-user: ${MINIO_USER}
  minio-password: ${MINIO_PASSWORD}
  bucket: luatgt
management.endpoints.web.exposure.include: health
