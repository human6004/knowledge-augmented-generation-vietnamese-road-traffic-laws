name: kag-legal

x-common: &common
  restart: unless-stopped
  environment: &tz
    TZ: ${TZ}
    LANG: C.UTF-8
  networks: [kag]

services:
  mysql:
    <<: *common
    build: { context: ./mysql, args: { UPSTREAM_TAG: ${UPSTREAM_TAG} } }
    image: ${REGISTRY}kag-legal-mysql:${TAG}
    container_name: kag-legal-mysql
    environment:
      <<: *tz
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: openspg
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    ports:
      - "127.0.0.1:${PORT_MYSQL}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12

  neo4j:
    <<: *common
    build: { context: ./neo4j, args: { UPSTREAM_TAG: ${UPSTREAM_TAG} } }
    image: ${REGISTRY}kag-legal-neo4j:${TAG}
    container_name: kag-legal-neo4j
    environment:
      <<: *tz
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "*"
      NEO4J_dbms_security_procedures_allowlist: "*"
      RESTORE_DUMP: /dumps/legal.dump
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./dumps:/dumps:ro
    ports:
      - "127.0.0.1:${PORT_NEO4J_HTTP}:7474"
      - "127.0.0.1:${PORT_NEO4J_BOLT}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30
      start_period: 30s

  minio:
    <<: *common
    build: { context: ./minio, args: { UPSTREAM_TAG: ${UPSTREAM_TAG} } }
    image: ${REGISTRY}kag-legal-minio:${TAG}
    container_name: kag-legal-minio
    command: server --console-address ":9001" /data
    environment:
      <<: *tz
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio-data:/data]
    ports:
      - "127.0.0.1:${PORT_MINIO}:9000"
      - "127.0.0.1:${PORT_MINIO_CONSOLE}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      retries: 12

  server:
    <<: *common
    build: { context: ./server, args: { UPSTREAM_TAG: ${UPSTREAM_TAG} } }
    image: ${REGISTRY}kag-legal-server:${TAG}
    container_name: kag-legal-server
    environment:
      <<: *tz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SERVER_XMS: ${SERVER_XMS}
      SERVER_XMX: ${SERVER_XMX}
    depends_on:
      mysql: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["${PORT_SERVER}:8887"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8887 >/dev/null || exit 1"]
      interval: 15s
      retries: 20
      start_period: 60s

  app:
    <<: *common
    build: { context: ./app }
    image: ${REGISTRY}kag-legal-app:${TAG}
    container_name: kag-legal-app
    environment:
      <<: *tz
      KAG_HOST_ADDR: http://server:8887
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./app/kag_config.yaml:/app/kag_config.yaml:ro
    depends_on:
      server: { condition: service_healthy }
    ports: ["${PORT_APP}:8000"]

  web:
    <<: *common
    build: { context: .., dockerfile: deploy/web/Dockerfile }
    image: ${REGISTRY}kag-legal-web:${TAG}
    container_name: kag-legal-web
    ports: ["${PORT_WEB}:80"]
    depends_on: [app]

volumes:
  mysql-data:
  neo4j-data:
  neo4j-logs:
  minio-data:

networks:
  kag:
    name: kag-legal-net
