global
    maxconn 32
    nbthread 1

defaults
    mode http
    timeout connect 5s
    timeout client 180s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 5s

frontend ingress
    bind :8080
    acl h1_get path -m str /v1/health /v1/graph/release /v1/pipeline/status /v1/benchmark/datasets /v1/operations/sample
    acl h1_post path -m str /v1/query /v1/query/stream /v1/retrieve /v1/retrieve/vector
    acl is_get method GET
    acl is_post method POST
    acl absolute_form url_reg -i ^https?://
    http-request deny deny_status 400 if absolute_form
    http-request deny deny_status 405 if { method CONNECT }
    http-request deny deny_status 404 unless h1_get or h1_post
    http-request deny deny_status 405 if h1_get !is_get
    http-request deny deny_status 405 if h1_post !is_post
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Real-IP
    default_backend kag_api

backend kag_api
    timeout server 180s
    server api kag-api:8000

# Only the API readbus address and separate gateway token may reach fixed providers.
frontend sample_provider
    bind "${KAG_PROVIDER_BIND}:8898"
    acl api_source src "${KAG_PROVIDER_CLIENT}"
    acl gateway_token req.hdr(X-KAG-Provider-Token) -m str -f /run/egress-credentials/egress.token
    acl chat_path path -m str /v1/chat/completions
    acl embed_path path -m str /v1/embeddings
    acl models_path path -m str /v1/models
    http-request deny deny_status 403 unless api_source gateway_token
    http-request deny deny_status 400 if { url_reg -i ^https?:// } or { query -m found }
    http-request deny deny_status 405 if { method CONNECT }
    http-request deny deny_status 404 unless chat_path or embed_path or models_path
    http-request deny deny_status 405 if models_path !{ method GET }
    http-request deny deny_status 405 if !models_path !{ method POST }
    http-request del-header X-KAG-Provider-Token
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    use_backend sample_embedding if embed_path
    default_backend sample_chat

backend sample_chat
    timeout server 60s
    http-request set-header Host 127.0.0.1:8317
    server operator host.docker.internal:8317

backend sample_embedding
    timeout server 60s
    http-request set-header Host api.vilao.ai
    server embedding api.vilao.ai:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(api.vilao.ai)
