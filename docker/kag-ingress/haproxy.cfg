global
    maxconn 32
    nbthread 1

defaults
    mode http
    timeout connect 5s
    timeout client 180s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

# Docker DNS identifies the API; the provider port is never published on the host.
frontend sample_provider
    bind :8898
    http-request do-resolve(txn.api_ip,docker,ipv4) str(kag-api)
    http-request set-var-fmt(txn.api_address) "%[var(txn.api_ip)]"
    acl api_source src,strcmp(txn.api_address) eq 0
    acl provider_enabled env(KAG_PROVIDER_ENABLED) -m str 1
    acl gateway_token req.hdr(X-KAG-Provider-Token) -m str -f /run/egress-credentials/egress.token
    acl chat_path path -m str /v1/chat/completions
    acl embed_path path -m str /v1/embeddings
    acl models_path path -m str /v1/models
    http-request deny deny_status 403 unless provider_enabled api_source gateway_token
    http-request deny deny_status 400 if { url_reg -i ^https?:// } or { query -m found }
    http-request deny deny_status 405 if { method CONNECT }
    http-request deny deny_status 404 unless chat_path or embed_path or models_path
    http-request deny deny_status 405 if models_path !{ method GET }
    http-request deny deny_status 405 if !models_path !{ method POST }
    http-request del-header X-KAG-Provider-Token
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    use_backend sample_embedding if embed_path
    default_backend sample_chat

backend sample_chat
    timeout server 60s
    http-request set-header Host "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"
    server operator "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"

backend sample_embedding
    timeout server 60s
    http-request set-header Host api.vilao.ai
    server embedding api.vilao.ai:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(api.vilao.ai)
