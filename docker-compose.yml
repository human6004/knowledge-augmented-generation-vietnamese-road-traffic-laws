name: webapp

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: luatgt
      MYSQL_USER: luatgt
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run docker/init-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run docker/init-env.ps1 -Update first}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--default-time-zone=+00:00"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["kag-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u luatgt luatgt -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run docker/init-env.ps1 first}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run docker/init-env.ps1 first}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./docker/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Run docker/init-env.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run docker/init-env.ps1 first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/luatgt?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: luatgt
      DB_PASSWORD: ${DB_PASSWORD:?Run docker/init-env.ps1 first}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run docker/init-env.ps1 first}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Run docker/init-env.ps1 first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run docker/init-env.ps1 first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run docker/init-env.ps1 first}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:?Run docker/init-env.ps1 first}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Run docker/init-env.ps1 first}
      KAG_BASE_URL: ${KAG_BASE_URL:-http://host.docker.internal:38000}
      KAG_TOKEN_FILE: /run/secrets/kag_query_token
      KAG_RELEASE_ID: ${KAG_RELEASE_ID:-}
      KAG_WEBAPP_SNAPSHOT_ID: ${KAG_WEBAPP_SNAPSHOT_ID:-}
      TZ: Asia/Ho_Chi_Minh
    secrets: [kag_query_token]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
  frontend:
    build:
      context: ./WebApp/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    ports: ["127.0.0.1:8081:80"]
    depends_on: [backend]
volumes:
  kag-data:
  redis-data:
  minio-data:
secrets:
  kag_query_token:
    file: ${KAG_TOKEN_FILE:?Provide an external backend-only KAG query token file}
